version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vitatrix-postgres
    restart: always
    environment:
      POSTGRES_DB: vitatrix
      POSTGRES_USER: vitatrix
      POSTGRES_PASSWORD: vitatrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
